<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Team Builder | jQuery Project - Ahmad Zakri</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Rajdhani',sans-serif;background:#0b0b14;color:#eee;min-height:100vh;padding:24px}
  .wrap{max-width:1000px;margin:auto}
  h1{font-family:'Press Start 2P',monospace;font-size:20px;text-align:center;color:#ffcc00;text-shadow:3px 3px #c1121f;margin-bottom:6px}
  .sub{text-align:center;color:#9aa;margin-bottom:20px}
  .panel{background:#151526;border:2px solid #2a2a44;border-radius:8px;padding:16px;margin-bottom:16px}
  .panel h2{font-family:'Press Start 2P',monospace;font-size:11px;color:#4cc9f0;margin-bottom:12px}
  .form{display:flex;flex-wrap:wrap;gap:8px}
  .form input,.form select{flex:1;min-width:140px;padding:10px;background:#0b0b14;border:1px solid #33335a;color:#fff;border-radius:4px;font:inherit}
  button{font-family:'Press Start 2P',monospace;font-size:10px;padding:10px 14px;border:none;border-radius:4px;cursor:pointer;background:#c1121f;color:#fff}
  button:hover{filter:brightness(1.2)}
  .btn-blue{background:#1d4ed8}
  .btn-grey{background:#33335a}
  .msg{height:20px;margin-top:8px;color:#ff6b6b;font-weight:700}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .filters button{background:#33335a}
  .filters button.active{background:#ffcc00;color:#000}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{background:#0b0b14;border:2px solid #33335a;border-radius:6px;padding:12px;cursor:pointer;position:relative;transition:border-color .2s,transform .2s}
  .card:hover{transform:translateY(-3px)}
  .card.picked{border-color:#ffcc00;box-shadow:0 0 12px #ffcc0066}
  .card h3{font-size:20px}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#1d4ed8;margin:4px 0 8px}
  .stat{font-size:13px;margin-top:4px}
  .bar{height:8px;background:#222;border-radius:4px;overflow:hidden}
  .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#c1121f,#ffcc00)}
  .details{display:none;font-size:14px;color:#bbb;margin-top:8px;border-top:1px dashed #33335a;padding-top:8px}
  .card .del{position:absolute;top:8px;right:8px;background:none;color:#888;font-size:12px;padding:2px}
  .card .info{background:none;color:#4cc9f0;padding:4px 0;font-size:8px}
  .team{display:flex;gap:10px;flex-wrap:wrap;min-height:60px}
  .slot{flex:1;min-width:150px;border:2px dashed #33335a;border-radius:6px;padding:12px;text-align:center;color:#666}
  .slot.filled{border-style:solid;border-color:#ffcc00;color:#fff}
  .power{font-family:'Press Start 2P',monospace;font-size:12px;margin-top:12px;color:#ffcc00}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  #vsBanner{display:none;font-family:'Press Start 2P',monospace;text-align:center;font-size:26px;color:#ffcc00;text-shadow:4px 4px #c1121f;padding:20px}
  .count{color:#9aa;font-size:14px;margin-bottom:8px}
  footer{text-align:center;color:#666;font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ARCADE TEAM BUILDER</h1>
  <p class="sub">Jobsheet 13 &mdash; jQuery Project &bull; Ahmad Zakri bin Ismail (2501084)</p>

  <!-- ADD FIGHTER -->
  <div class="panel">
    <h2>+ CREATE FIGHTER</h2>
    <div class="form">
      <input type="text" id="fName" placeholder="Fighter name">
      <select id="fStyle">
        <option value="Striker">Striker</option>
        <option value="Grappler">Grappler</option>
        <option value="Zoner">Zoner</option>
      </select>
      <input type="number" id="fPower" placeholder="Power (1-100)" min="1" max="100">
      <input type="number" id="fSpeed" placeholder="Speed (1-100)" min="1" max="100">
      <button id="addBtn">ADD</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <!-- ROSTER -->
  <div class="panel">
    <h2>ROSTER (CLICK TO PICK, MAX 3)</h2>
    <div class="filters">
      <button class="active" data-filter="All">ALL</button>
      <button data-filter="Striker">STRIKER</button>
      <button data-filter="Grappler">GRAPPLER</button>
      <button data-filter="Zoner">ZONER</button>
    </div>
    <p class="count">Showing <b id="shown">0</b> fighter(s)</p>
    <div class="grid" id="roster"></div>
  </div>

  <!-- TEAM -->
  <div class="panel">
    <h2>MY TEAM</h2>
    <div class="team" id="team"></div>
    <div class="power">TEAM POWER: <span id="teamPower">0</span></div>
    <div class="actions">
      <button class="btn-blue" id="randomBtn">RANDOM TEAM</button>
      <button class="btn-grey" id="clearBtn">CLEAR TEAM</button>
      <button id="fightBtn">FIGHT!</button>
    </div>
    <div id="vsBanner">READY... GO!</div>
  </div>

  <footer>Built with HTML, CSS &amp; jQuery 3.7.1</footer>
</div>

<script>
$(function () {

  // ---------- DATA ----------
  var fighters = [
    { id: 1, name: "Blaze Kaito",  style: "Striker",  power: 82, speed: 90, bio: "Fire-fist striker who rushes in with fast combos." },
    { id: 2, name: "Iron Borhan",  style: "Grappler", power: 95, speed: 45, bio: "Heavy grappler. One command grab takes half your life." },
    { id: 3, name: "Luna Sari",    style: "Zoner",    power: 70, speed: 78, bio: "Controls space with crescent projectiles." },
    { id: 4, name: "Rex Volta",    style: "Striker",  power: 76, speed: 85, bio: "Electric kicks and a tricky dash cancel." },
    { id: 5, name: "Mira Kold",    style: "Zoner",    power: 68, speed: 72, bio: "Ice walls keep opponents locked out." },
    { id: 6, name: "Tank Hamzah",  style: "Grappler", power: 90, speed: 50, bio: "Armored throws and huge damage up close." }
  ];
  var nextId = 7;
  var team = [];           // array of ids
  var currentFilter = "All";
  var MAX = 3;

  // ---------- RENDER ROSTER ----------
  function renderRoster() {
    var $roster = $("#roster").empty();

    $.each(fighters, function (i, f) {
      var $card = $("<div>", { "class": "card", "data-id": f.id, "data-style": f.style });
      $card.html(
        '<button class="del" title="Remove">&#10005;</button>' +
        '<h3>' + f.name + '</h3>' +
        '<span class="tag">' + f.style + '</span>' +
        '<div class="stat">Power ' + f.power + '</div><div class="bar"><span data-w="' + f.power + '"></span></div>' +
        '<div class="stat">Speed ' + f.speed + '</div><div class="bar"><span data-w="' + f.speed + '"></span></div>' +
        '<button class="info">&#9660; DETAILS</button>' +
        '<div class="details">' + f.bio + '</div>'
      );
      if ($.inArray(f.id, team) !== -1) $card.addClass("picked");
      $roster.append($card);
    });

    applyFilter(false);
    animateBars();
  }

  // ---------- ANIMATE STAT BARS ----------
  function animateBars() {
    $("#roster .bar span").each(function () {
      $(this).css("width", 0).animate({ width: $(this).data("w") + "%" }, 700);
    });
  }

  // ---------- FILTER ----------
  function applyFilter(animate) {
    var $cards = $("#roster .card");
    $cards.each(function () {
      var match = currentFilter === "All" || $(this).data("style") === currentFilter;
      if (animate) { match ? $(this).fadeIn(250) : $(this).fadeOut(250); }
      else { $(this).toggle(match); }
    });
    var shown = currentFilter === "All" ? fighters.length
      : $.grep(fighters, function (f) { return f.style === currentFilter; }).length;
    $("#shown").text(shown);
  }

  $(".filters button").on("click", function () {
    $(".filters button").removeClass("active");
    $(this).addClass("active");
    currentFilter = $(this).data("filter");
    applyFilter(true);
  });

  // ---------- RENDER TEAM ----------
  function renderTeam() {
    var $team = $("#team").empty();
    var total = 0;

    for (var i = 0; i < MAX; i++) {
      var $slot = $("<div>", { "class": "slot" });
      if (team[i]) {
        var f = getFighter(team[i]);
        total += f.power + f.speed;
        $slot.addClass("filled").html("<b>P" + (i + 1) + "</b><br>" + f.name + "<br><small>" + f.style + "</small>").hide().fadeIn(300);
      } else {
        $slot.text("EMPTY SLOT");
      }
      $team.append($slot);
    }

    // animated counter
    $({ n: parseInt($("#teamPower").text(), 10) || 0 }).animate({ n: total }, {
      duration: 500,
      step: function (now) { $("#teamPower").text(Math.round(now)); }
    });

    $("#roster .card").each(function () {
      $(this).toggleClass("picked", $.inArray($(this).data("id"), team) !== -1);
    });
  }

  function getFighter(id) {
    return $.grep(fighters, function (f) { return f.id === id; })[0];
  }

  // ---------- PICK / UNPICK (event delegation) ----------
  $("#roster").on("click", ".card", function () {
    var id = $(this).data("id");
    var idx = $.inArray(id, team);

    if (idx !== -1) {
      team.splice(idx, 1);
    } else if (team.length < MAX) {
      team.push(id);
    } else {
      showMsg("Team is full! Remove a fighter first.");
      $(this).animate({ marginLeft: "-6px" }, 60).animate({ marginLeft: "6px" }, 60).animate({ marginLeft: "0" }, 60);
      return;
    }
    renderTeam();
  });

  // details toggle
  $("#roster").on("click", ".info", function (e) {
    e.stopPropagation();
    var $d = $(this).next(".details");
    $d.slideToggle(200);
    $(this).html($d.is(":visible") ? "&#9660; DETAILS" : "&#9650; HIDE");
  });

  // delete fighter
  $("#roster").on("click", ".del", function (e) {
    e.stopPropagation();
    var $card = $(this).closest(".card");
    var id = $card.data("id");
    $card.fadeOut(300, function () {
      fighters = $.grep(fighters, function (f) { return f.id !== id; });
      team = $.grep(team, function (t) { return t !== id; });
      renderRoster();
      renderTeam();
    });
  });

  // ---------- ADD FIGHTER ----------
  function showMsg(text, ok) {
    $("#msg").stop(true, true).css("color", ok ? "#4ade80" : "#ff6b6b").text(text).show().delay(2000).fadeOut(400);
  }

  $("#addBtn").on("click", function () {
    var name  = $.trim($("#fName").val());
    var style = $("#fStyle").val();
    var power = parseInt($("#fPower").val(), 10);
    var speed = parseInt($("#fSpeed").val(), 10);

    if (!name) return showMsg("Please enter a fighter name.");
    if (isNaN(power) || power < 1 || power > 100) return showMsg("Power must be 1 - 100.");
    if (isNaN(speed) || speed < 1 || speed > 100) return showMsg("Speed must be 1 - 100.");

    fighters.push({ id: nextId++, name: name, style: style, power: power, speed: speed, bio: "Custom fighter created by the player." });
    $("#fName, #fPower, #fSpeed").val("");
    showMsg(name + " joined the roster!", true);
    renderRoster();
    $("#roster .card").last().hide().fadeIn(500);
  });

  $("#fName, #fPower, #fSpeed").on("keypress", function (e) {
    if (e.which === 13) $("#addBtn").click();
  });

  // ---------- TEAM ACTIONS ----------
  $("#clearBtn").on("click", function () {
    team = [];
    renderTeam();
    $("#vsBanner").slideUp(200);
  });

  $("#randomBtn").on("click", function () {
    var ids = $.map(fighters, function (f) { return f.id; });
    team = [];
    while (team.length < MAX && ids.length) {
      team.push(ids.splice(Math.floor(Math.random() * ids.length), 1)[0]);
    }
    renderTeam();
  });

  $("#fightBtn").on("click", function () {
    if (team.length < MAX) return showMsg("Pick 3 fighters before you fight!");
    $("#vsBanner").hide().text("READY...").slideDown(300)
      .delay(600).fadeOut(150, function () { $(this).text("GO!!").fadeIn(150); });
  });

  // ---------- INIT ----------
  renderRoster();
  renderTeam();
});
</script>
</body>
</html>
