<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <link rel="stylesheet" href="Lab8.css">
    <style>*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style>
    <script src="Lab9.js"></script>
</head>
<body>
<header>
    <h1>Event Registration Form</h1>
</header>
<main>
<form id="mainForm" action="#" method="post">
    <div class="form-row">
        <label for="field1">Participant Name</label>
        <input type="text" id="field1" class="required hilightable">
    </div>
    <div class="form-row">
        <label for="field2">Registration ID</label>
        <input type="text" id="field2" class="required hilightable">
    </div>

    <div class="form-row">
        <label for="field3">Email</label>
        <input type="text" id="field3" class="required hilightable">
    </div>
    <div class="form-row">
        <label for="field4">Event Type</label>
        <select id="field4" class="required hilightable">
            <option value="">Choose an option</option>
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select>
    </div>
    <div class="form-row">
        <label for="field5">Contact Number</label>
        <input type="text" id="field5" class="required hilightable">
    </div>
    <div class="form-actions">
        <button type="submit">Submit</button>
        <button type="reset">Clear Form</button>
    </div>
</form>
</main>
<footer style="text-align:center;padding:12px;font-family:Arial;color:#555">AHMAD ZAKRI BIN ISMAIL (2501084) &middot; Job Sheet 08 &middot; Set 3 &ndash; Event Registration</footer>
</body>
</html>
